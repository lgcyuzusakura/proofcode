<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>ProofCode</title><style>#boot-error{display:none;margin:32px;padding:20px;border:1px solid #efb7b7;background:#fff7f7;color:#9f2f2f;font:13px ui-monospace,monospace;white-space:pre-wrap}</style></head><body><div id="root"></div><pre id="boot-error"></pre><script>window.addEventListener('error',function(e){var n=document.getElementById('boot-error');n.style.display='block';n.textContent='ProofCode 启动失败\n\n'+(e.error&&e.error.stack||e.message||e);});window.addEventListener('unhandledrejection',function(e){var n=document.getElementById('boot-error');n.style.display='block';n.textContent='ProofCode 启动失败\n\n'+(e.reason&&e.reason.stack||e.reason||e);});</script><script type="module" src="/src/main.tsx"></script></body></html>

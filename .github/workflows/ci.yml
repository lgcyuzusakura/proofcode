name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: proofcode-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent-engine/go.mod
          cache: true
          cache-dependency-path: agent-engine/go.sum
      - name: Run Go tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  java:
    name: Java tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: data_test
          POSTGRES_USER: proofcode
          POSTGRES_PASSWORD: data-test-only
        ports:
          - 15491:5432
        options: >-
          --health-cmd "pg_isready -U proofcode -d data_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 16491:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: control-plane
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: control-plane/pom.xml
      - name: Set up Go for the MCP integration helper
        uses: actions/setup-go@v5
        with:
          go-version-file: agent-engine/go.mod
          cache: true
          cache-dependency-path: agent-engine/go.sum
      - name: Build MCP integration helper
        working-directory: agent-engine
        env:
          CGO_ENABLED: "0"
        run: go build -o ../control-plane/target/proofcode-mcp-inspect ./cmd/proofcode-mcp-inspect
      - name: Run Maven tests
        env:
          PROOFCODE_MCP_INSPECT_TEST_BIN: ${{ github.workspace }}/control-plane/target/proofcode-mcp-inspect
          PROOFCODE_LIVE_DATA_TEST: "true"
          PROOFCODE_LIVE_DATA_HOST: 127.0.0.1
        run: mvn --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build

  native:
    name: Windows desktop build and tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/native
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/native/go.mod
          cache: true
          cache-dependency-path: desktop/native/go.sum
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up embedded Java build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: control-plane/pom.xml
      - name: Test offline package composition
        working-directory: .
        run: python -m unittest desktop.test_export_offline_runtime -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/native/frontend/package-lock.json
      - name: Install and build desktop frontend
        working-directory: desktop/native/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Prepare embedded runtime and MCP templates
        working-directory: .
        shell: pwsh
        run: |
          ./desktop/prepare-runtime-bundle.ps1
          ./desktop/prepare-mcp-template.ps1
      - name: Warm up Chromium on the Windows runner
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP ('proofcode-chrome-warmup-' + [Guid]::NewGuid().ToString('N'))
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          try {
            $arguments = @('--headless=new', '--no-first-run', '--no-default-browser-check', '--disable-background-networking', "--user-data-dir=`"$profile`"", '--dump-dom', 'about:blank')
            $process = Start-Process -FilePath $chrome -ArgumentList $arguments -WindowStyle Hidden -PassThru
            $null = $process.Handle
            if (-not $process.WaitForExit(60000)) { $process.Kill($true); throw 'Chromium cold startup exceeded 60 seconds' }
            if ($process.ExitCode -ne 0) { throw 'Chromium warmup failed' }
          } finally {
            $temporaryRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
            if (-not [IO.Path]::GetFullPath($profile).StartsWith($temporaryRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Warmup cleanup escaped runner temporary directory' }
            if (Test-Path -LiteralPath $profile) { Remove-Item -LiteralPath $profile -Recurse -Force }
          }
      - name: Test native project operations
        env:
          # Use the runner's Chrome to avoid Edge's first-run DevTools Welcome panel.
          PROOFCODE_BROWSER_EXECUTABLE: C:\Program Files\Google\Chrome\Application\chrome.exe
          PROOFCODE_BROWSER_HEADLESS: "1"
          PROOFCODE_DEVTOOLS_HEADLESS: "1"
        run: go test ./... -count=1
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Build Windows application
        run: wails build -clean
      - name: Package embedded standalone services
        working-directory: .
        shell: pwsh
        run: |
          $gitArchive = Join-Path $env:RUNNER_TEMP 'proofcode-mingit.zip'
          $searchArchive = Join-Path $env:RUNNER_TEMP 'proofcode-ripgrep.zip'
          Invoke-WebRequest 'https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.3/MinGit-2.56.0.3-64-bit.zip' -OutFile $gitArchive
          Invoke-WebRequest 'https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip' -OutFile $searchArchive
          ./desktop/prepare-standalone.ps1 -JdkHome $env:JAVA_HOME -MavenBin (Get-Command mvn.cmd).Source -GitArchive $gitArchive -GitArchiveSha256 '2e5619966e588fde5f8122c5557cad50c0fbafcaed736689f40ec1dfb1d78ea7' -RipgrepArchive $searchArchive -RipgrepArchiveSha256 '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5' -OutputDirectory './desktop/native/build/bin/standalone'
      - name: Verify packaged startup, approval, restart and cancellation
        working-directory: desktop/native
        shell: pwsh
        run: |
          $env:PROOFCODE_STANDALONE_TEST_BUNDLE = Join-Path $PWD 'build/bin/standalone'
          go test ./... -run TestStandalonePackagedWorkflowAndRestart -count=1 -v
      - name: Save Windows application
        uses: actions/upload-artifact@v4
        with:
          name: proofcode-windows-amd64
          path: desktop/native/build/bin/
          if-no-files-found: error

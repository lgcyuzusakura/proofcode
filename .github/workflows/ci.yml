name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: proofcode-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent-engine/go.mod
          cache: true
          cache-dependency-path: agent-engine/go.sum
      - name: Run Go tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  java:
    name: Java tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: control-plane/pom.xml
      - name: Run Maven tests
        run: mvn --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build

  native:
    name: Windows desktop build and tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/native
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/native/go.mod
          cache: true
          cache-dependency-path: desktop/native/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/native/frontend/package-lock.json
      - name: Install and build desktop frontend
        working-directory: desktop/native/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Test native project operations
        run: go test ./... -count=1
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Build Windows application
        run: wails build -clean
      - name: Save Windows application
        uses: actions/upload-artifact@v4
        with:
          name: proofcode-windows-amd64
          path: desktop/native/build/bin/*.exe
          if-no-files-found: error

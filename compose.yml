name: proofcode

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proofcode}
      POSTGRES_USER: ${POSTGRES_USER:-proofcode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proofcode}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proofcode} -d ${POSTGRES_DB:-proofcode}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${PROOFCODE_POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    ports:
      - "${PROOFCODE_REDIS_PORT:-6379}:6379"

  artemis:
    image: apache/activemq-artemis:2.39.0
    restart: unless-stopped
    environment:
      ARTEMIS_USER: proofcode
      ARTEMIS_PASSWORD: proofcode
      ANONYMOUS_LOGIN: "false"
      EXTRA_ARGS: "--queues agent.task.requested:anycast"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8161/console/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "${PROOFCODE_ARTEMIS_CORE_PORT:-61616}:61616"
      - "${PROOFCODE_ARTEMIS_AMQP_PORT:-5672}:5672"
      - "${PROOFCODE_ARTEMIS_CONSOLE_PORT:-8161}:8161"
    volumes:
      - artemis-data:/var/lib/artemis-instance

  control-plane:
    build:
      context: ./control-plane
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-proofcode}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-proofcode}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-proofcode}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SPRING_ARTEMIS_USER: proofcode
      SPRING_ARTEMIS_PASSWORD: proofcode
      PROOFCODE_AUTH_TOKEN: ${DEV_AUTH_TOKEN:-change-me}
      PROOFCODE_RUNNER_TOKEN: ${RUNNER_TOKEN:-change-runner-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      artemis:
        condition: service_healthy
    ports:
      - "${PROOFCODE_CONTROL_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  runner:
    build:
      context: ./agent-engine
    restart: unless-stopped
    environment:
      CONTROL_PLANE_URL: http://control-plane:8080
      RUNNER_TOKEN: ${RUNNER_TOKEN:-change-runner-token}
      ARTEMIS_URL: amqp://proofcode:proofcode@artemis:5672
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4.1-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      RUNNER_ALLOW_WRITE: ${RUNNER_ALLOW_WRITE:-false}
      RUNNER_ALLOW_EXEC: ${RUNNER_ALLOW_EXEC:-false}
      RUNNER_ALLOWED_PROGRAMS: ${RUNNER_ALLOWED_PROGRAMS:-go,node,npm,npx,python3,pytest,git,rg}
      RUNNER_MAX_COMMAND_SECONDS: ${RUNNER_MAX_COMMAND_SECONDS:-120}
      JEV_MODE: ${JEV_MODE:-off}
      JEV_BASE_URL: ${JEV_BASE_URL:-}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_MIN_CONFIDENCE: ${JEV_MIN_CONFIDENCE:-0.85}
      JEV_API_KEY: ${JEV_API_KEY:-}
      WORKSPACE_ROOT: /workspaces
    depends_on:
      control-plane:
        condition: service_healthy
      artemis:
        condition: service_healthy
    volumes:
      - proofcode-workspaces:/workspaces

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - control-plane
    ports:
      - "${PROOFCODE_WEB_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  artemis-data:
  proofcode-workspaces:

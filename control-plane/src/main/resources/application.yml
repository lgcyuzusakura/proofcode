server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: proofcode-control-plane
  datasource:
    url: jdbc:postgresql://localhost:5432/proofcode
    username: proofcode
    password: proofcode
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  artemis:
    mode: native
    broker-url: tcp://localhost:61616
    user: proofcode
    password: proofcode
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

proofcode:
  auth-token: ${PROOFCODE_AUTH_TOKEN:change-me}
  runner-token: ${PROOFCODE_RUNNER_TOKEN:change-runner-token}
  queue: agent.task.requested

